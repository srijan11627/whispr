# Render blueprint — "New → Blueprint" picks this up automatically.
# Free tier, no credit card. Chat history lives in Turso (also free, no card).
services:
  - type: web
    name: whispr
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: "*"            # simplest: allow the served client + any origin (JWT still enforced)
      - key: DATABASE_URL
        sync: false           # paste your libsql://... URL from `turso db show whispr --url`
      - key: DATABASE_AUTH_TOKEN
        sync: false           # paste the token from `turso db tokens create whispr`
      - key: JWT_SECRET
        generateValue: true   # Render generates a random secret on first deploy
